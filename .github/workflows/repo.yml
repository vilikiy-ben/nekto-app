# В репозитории только продукт: белый список .gitignore, картинки и Markdown только на своих местах, без больших
# файлов и путей домашней папки (scripts/checks/repo-hygiene.py). Linux — проверке не нужен macOS.
name: repo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Только продукт
        run: python3 scripts/checks/repo-hygiene.py
