name: Nekto
options:
  bundleIdPrefix: app.nekto
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
  configs:
    # Без strip в исполняемом файле остаётся карта отладки: пути исходников и .o на машине сборки
    # (/Users/<имя>/…) — их видит любой, кто скачал образ. Символы для разбора падений — в .dSYM рядом со сборкой.
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
targets:
  Nekto:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/engine-sandbox.sb
        buildPhase: resources
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Brand.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nekto.mac
        PRODUCT_NAME: Nekto
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Nekto.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed onboarding scenes, engine and uv
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}/.."
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          # Сцены онбординга — из App/Onboarding, до подписи бандла в embed-engine.sh.
          "${ROOT}/scripts/embed-onboarding.sh" "${APP}"
          "${ROOT}/scripts/embed-engine.sh" "${APP}"
        basedOnDependencyAnalysis: false
